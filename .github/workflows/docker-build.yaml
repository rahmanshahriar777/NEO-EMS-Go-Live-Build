name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    name: Build Multi-stage Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: ems-api
            dockerfile: apps/api/Dockerfile
          - name: ems-web
            dockerfile: apps/web/Dockerfile
          - name: ems-worker
            dockerfile: apps/worker/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags (go-live §5.4): every build pushes an immutable per-commit
      # `sha-<short-sha>` tag plus semver tags on v* releases. `:latest` is
      # still published on main as a DEVELOPER CONVENIENCE ONLY — it is never
      # a deployable artifact: deploy-prod.yaml pins sha-/semver tags, and
      # the k8s manifests refuse :latest (imagePullPolicy: Always + pinned tag
      # substituted by CI). Do not point any environment at :latest.
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
