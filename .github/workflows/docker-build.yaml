name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    name: Build Multi-stage Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: ems-api
            dockerfile: apps/api/Dockerfile
          - name: ems-web
            dockerfile: apps/web/Dockerfile
          - name: ems-worker
            dockerfile: apps/worker/Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags (go-live §5.4): every build pushes an immutable per-commit
      # `sha-<short-sha>` tag plus semver tags on v* releases. `:latest` is
      # still published on main as a DEVELOPER CONVENIENCE ONLY — it is never
      # a deployable artifact: deploy-prod.yaml pins sha-/semver tags, and
      # the k8s manifests refuse :latest (imagePullPolicy: Always + pinned tag
      # substituted by CI). Do not point any environment at :latest.
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # F6: NEXT_PUBLIC_* vars are inlined into the web client bundle at
          # BUILD time — runtime env vars on the pod cannot change them, so
          # the values must be baked here. Sourced from repository/org
          # Variables; when unset, the fallbacks below (mirroring the web
          # Dockerfile defaults / apps/web/.env.example) apply. An explicitly
          # empty build-arg OVERRIDES the Dockerfile default, hence the `||`
          # fallbacks — do not pass bare `${{ vars.X }}` here.
          # Changing any value requires rebuilding the ems-web image; see
          # docs/DEPLOYMENT.md. Only the web Dockerfile declares these ARGs;
          # the api/worker builds ignore unknown build-args.
          #
          # #5-infra: API_INTERNAL_URL is NOT a client var — it is the
          # server-side /api/* rewrite destination in next.config.mjs, which
          # is resolved when the image is BUILT (the baked routes manifest
          # does not re-read the env var at runtime). A runtime env entry
          # has no effect on rewrites, so it must arrive as a build-arg.
          # Default is the in-cluster k8s DNS name (these images deploy to
          # k8s); override with the vars.API_INTERNAL_URL repository/org
          # Variable for other topologies, e.g. http://api:4000/api/:path*
          # for docker-compose. Rebuild the web image to change it.
          build-args: |
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL || 'http://ems-api-service:4000/api/:path*' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || '/api/v1' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
            NEXT_PUBLIC_TIMEZONE=${{ vars.NEXT_PUBLIC_TIMEZONE || 'Europe/London' }}
            NEXT_PUBLIC_LOCALE=${{ vars.NEXT_PUBLIC_LOCALE || 'en-GB' }}
            NEXT_PUBLIC_CURRENCY=${{ vars.NEXT_PUBLIC_CURRENCY || 'GBP' }}
            NEXT_PUBLIC_ALLOW_PUBLIC_REGISTRATION=${{ vars.NEXT_PUBLIC_ALLOW_PUBLIC_REGISTRATION || 'false' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME || '' }}
            NEXT_PUBLIC_SITE_LATITUDE=${{ vars.NEXT_PUBLIC_SITE_LATITUDE || '' }}
            NEXT_PUBLIC_SITE_LONGITUDE=${{ vars.NEXT_PUBLIC_SITE_LONGITUDE || '' }}
            NEXT_PUBLIC_SITE_RADIUS_METERS=${{ vars.NEXT_PUBLIC_SITE_RADIUS_METERS || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
