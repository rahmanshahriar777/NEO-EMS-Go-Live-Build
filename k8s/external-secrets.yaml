# ==============================================================================
# External Secrets Operator (ESO) — Automated Secret Synchronization
# ==============================================================================
# Replaces manual creation of Kubernetes Secrets and removes raw secrets from CI.
# Synchronizes sensitive credentials from cloud secret stores (AWS Secrets Manager,
# GCP Secret Manager, Azure Key Vault, or HashiCorp Vault) directly into the
# Kubernetes Secret `ems-secrets` in `ems-production`.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ems-secret-store
  namespace: ems-production
spec:
  provider:
    # Example: AWS Secrets Manager via IRSA / OIDC
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: ems-workload-identity
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ems-external-secrets
  namespace: ems-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ems-secret-store
    kind: SecretStore
  target:
    name: ems-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: production/ems/credentials
        property: DATABASE_URL
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: production/ems/credentials
        property: JWT_ACCESS_SECRET
    - secretKey: DOCUMENT_ENCRYPTION_KEY
      remoteRef:
        key: production/ems/credentials
        property: DOCUMENT_ENCRYPTION_KEY
    - secretKey: DOCUMENT_ENCRYPTION_KEY_PREVIOUS
      remoteRef:
        key: production/ems/credentials
        property: DOCUMENT_ENCRYPTION_KEY_PREVIOUS
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/ems/credentials
        property: REDIS_PASSWORD
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: production/ems/credentials
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: production/ems/credentials
        property: S3_SECRET_KEY
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: production/ems/credentials
        property: SMTP_PASSWORD
    - secretKey: AI_GEMINI_API_KEY
      remoteRef:
        key: production/ems/credentials
        property: AI_GEMINI_API_KEY
    - secretKey: AI_GROQ_API_KEY
      remoteRef:
        key: production/ems/credentials
        property: AI_GROQ_API_KEY
