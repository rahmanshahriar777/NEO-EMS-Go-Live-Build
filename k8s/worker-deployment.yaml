apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-worker
  namespace: ems-production
  labels:
    app: ems-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-worker
  template:
    metadata:
      labels:
        app: ems-worker
    spec:
      # Hardened pod security (go-live §5.3 item 9). The image runs as the
      # non-root `node` user (see apps/worker/Dockerfile `USER node`, uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Image coordinates are SUBSTITUTED BY CI (deploy-prod.yaml via
          # envsubst): IMAGE_REGISTRY/IMAGE_REPOSITORY/IMAGE_TAG.
          # Manual `kubectl apply` of this file WITHOUT envsubst will not
          # resolve the image — export the three vars first (see the same
          # comment in k8s/api-deployment.yaml). NEVER :latest.
          # No HTTP probes: the worker serves no traffic. Liveness is the
          # BullMQ heartbeat + structured logs; K8s restarts on crash via
          # restartPolicy. Startup recovery requeues stuck jobs (see
          # apps/worker/src/main.ts recoverStuckJobs).
          image: ${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}/ems-worker:${IMAGE_TAG}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ems-config
            - secretRef:
                name: ems-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const fs=require('fs'); if (!fs.existsSync('/tmp/worker-heartbeat') || Date.now()-Number(fs.readFileSync('/tmp/worker-heartbeat','utf8'))>60000) process.exit(1);"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Writable /tmp alongside the read-only root filesystem.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ems-worker
  namespace: ems-production
  labels:
    app: ems-worker
spec:
  selector:
    app: ems-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
# ==============================================================================
# HPA for the BullMQ worker: dual-scaling on CPU + BullMQ Queue Depth.
# Worker exports metrics on :9100/metrics (bullmq_queue_waiting_jobs).
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-worker-hpa
  namespace: ems-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: bullmq_queue_waiting_jobs
        target:
          type: AverageValue
          averageValue: "25"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ems-worker-queue-scaler
  namespace: ems-production
spec:
  scaleTargetRef:
    name: ems-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.monitoring.svc:9090
        metricName: bullmq_queue_waiting_jobs_total
        query: sum(bullmq_queue_waiting_jobs)
        threshold: "25"
