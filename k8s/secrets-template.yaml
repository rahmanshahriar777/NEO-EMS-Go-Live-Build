# ==============================================================================
# NEO EMS — Kubernetes secrets TEMPLATE (B3)
# ==============================================================================
# DO NOT commit real values. Copy this file, fill the REPLACE_WITH_* values
# (generate with: openssl rand -base64 48 / openssl rand -hex 32), and apply
# with:  kubectl apply -f k8s/secrets.yaml
# Prefer a real secret manager (External Secrets Operator, Sealed Secrets,
# cloud KMS) for production — this file is the documented minimum.
#
# Mirrors .env.example: every REQUIRED secret the code reads is listed here.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ems-secrets
  namespace: ems-production
type: Opaque
stringData:
  # Managed PostgreSQL connection string (external — no in-cluster postgres).
  DATABASE_URL: "postgresql://ems_admin:REPLACE_WITH_SECURE_PASSWORD@REPLACE_WITH_MANAGED_POSTGRES_HOST:5432/ems_db?schema=public"
  # 64-char random: openssl rand -base64 48
  JWT_ACCESS_SECRET: "REPLACE_WITH_64_CHAR_ACCESS_SECRET"
  # S3-compatible storage credentials (buckets stay private — no anonymous
  # bucket policy in any environment).
  S3_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY"
  S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"
  # 32-byte HEX key for AES-256-GCM document encryption: openssl rand -hex 32
  # Rotation procedure: docs/KEY_ROTATION.md
  DOCUMENT_ENCRYPTION_KEY: "REPLACE_WITH_64_HEX_CHAR_DOCUMENT_KEY"
  # Redis AUTH password (required by the hardened redis config).
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
  # SMTP auth password (the code reads SMTP_PASSWORD — one name everywhere).
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
  # AI provider keys (required only when AI features are enabled).
  AI_GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  AI_GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  # OAuth sign-in secrets. Client IDs / redirect URIs live in the ConfigMap
  # (k8s/configmap.yaml); only the secrets are here. Required in production
  # only when OAUTH_ENABLED=true, and only for providers that are configured.
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_OAUTH_SECRET"
  MICROSOFT_CLIENT_SECRET: "REPLACE_WITH_MICROSOFT_OAUTH_SECRET"
