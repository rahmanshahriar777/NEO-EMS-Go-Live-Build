apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-clamav
  namespace: ems-production
  labels:
    app: ems-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-clamav
  template:
    metadata:
      labels:
        app: ems-clamav
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          imagePullPolicy: IfNotPresent
          env:
            - name: CLAMD_STARTUP_TIMEOUT
              value: "180"
            - name: CLAMD_CONF_StreamMaxLength
              value: "64M"
            - name: CLAMD_CONF_MaxFileSize
              value: "64M"
            - name: CLAMD_CONF_MaxScanSize
              value: "256M"
            - name: CLAMD_CONF_ReadTimeout
              value: "60"
          ports:
            - name: clamd
              containerPort: 3310
          resources:
            requests:
              cpu: "250m"
              memory: "1024Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ems-clamav
  namespace: ems-production
  labels:
    app: ems-clamav
spec:
  ports:
    - name: clamd
      port: 3310
      targetPort: 3310
  selector:
    app: ems-clamav

